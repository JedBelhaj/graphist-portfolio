<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="die-cut" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feComponentTransfer in="blur" result="edge"><feFuncA type="linear" slope="40" intercept="-0.6"/></feComponentTransfer>
      <feFlood flood-color="#fff"/>
      <feComposite in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#die-cut)">
    <rect x="26" y="44" width="148" height="112" rx="30" fill="#00c0b3"/>
    <path d="M86 76a6 6 0 0 1 9-5l40 24a6 6 0 0 1 0 10l-40 24a6 6 0 0 1-9-5z" fill="#fff"/>
  </g>
</svg>
